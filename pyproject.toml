[project]
name = "pagesight"
version = "0.1.0"
description = "Find the right PDF page by looking at page images, answer with a small VLM, and cite the page."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kunal Chandrakar", email = "kunalchandrakar2005@gmail.com" }]
requires-python = "==3.11.*"
dependencies = [
    "bitsandbytes>=0.50.2",
    "bm25s>=0.3.12",
    "colpali-engine>=0.3.18",
    "datasets>=5.0.1",
    "fastapi>=0.142.2",
    "gradio>=6.29.1",
    "numpy>=2.4.6",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "qdrant-client==1.19.1",
    "sentence-transformers>=6.1.0",
    "spaces>=0.51.3",
    "torch==2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

# PyPI only has CPU builds of torch for Windows; CUDA builds come from PyTorch's own index (D-009).
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }  # must match torch's CUDA build (colpali-engine needs it)

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
